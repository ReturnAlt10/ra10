<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RA10 Schools</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo.png" type="image/png">
<script>
  (function () { try { var t = localStorage.getItem('ra10-theme'); if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); } catch (e) {} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/school/school.css?v=20261126">
<script src="/ra10-sdk.js?v=20261113"></script>
<script src="/refresh/ra10-units.js?v=20270110"></script>
<script src="/refresh/ra10-track.js?v=20261104"></script>
<script src="/refresh/ra10-activity-view.js?v=20261104"></script>
</head>
<body>
<header class="sc-top">
  <a class="sc-brand" href="/"><img src="/logo.png" alt="" width="30" height="30"><span>RA10 <b>Schools</b></span></a>
  <div class="sc-school" id="sc-school"></div>
  <div class="sc-top-actions">
    <button type="button" class="sc-icon" id="sc-theme" aria-label="Toggle dark mode" title="Light / dark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <a class="sc-btn ghost" href="/">Back to RA10</a>
  </div>
</header>
<div class="sc-layout">
  <nav class="sc-nav" id="sc-nav" aria-label="School sections" hidden></nav>
  <main class="sc-main" id="sc-main" tabindex="-1">
    <div class="sc-loading"><span class="sc-spin"></span> Loading your school…</div>
  </main>
</div>
<div class="sc-toast" id="sc-toast" role="status" aria-live="polite"></div>
<script src="/school/school.js?v=20261213"></script>
</body>
</html>
