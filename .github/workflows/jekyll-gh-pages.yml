name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site artifact
        run: |
          mkdir _site
          rsync -a \
            --exclude='_site' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='supabase' \
            --exclude='training-data' \
            --exclude='tools' \
            --exclude='node_modules' \
            --exclude='enterprise' \
            --exclude='specs' \
            --exclude='.specify' \
            --exclude='CLAUDE.md' \
            ./ _site/
          mkdir -p _site/tools
          rsync -a tools/activity/ _site/tools/activity/
          rsync -a tools/python-lab/ _site/tools/python-lab/
          rsync -a tools/prerelease/ _site/tools/prerelease/
          rsync -a tools/bug-hunt/ _site/tools/bug-hunt/
          rsync -a tools/scan/ _site/tools/scan/
          cp tools/ai-tools.css _site/tools/ai-tools.css
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
