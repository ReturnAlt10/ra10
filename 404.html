<script>
/* GitHub Pages serves this file for any path it can't find, e.g. /leaderboard or
   /btec/level-3/sport/unit-1. Those are app routes, so hand the path to the app
   shell (index.html), which puts the clean URL back in the address bar. */
(function () {
  var l = window.location;
  var route = l.pathname + l.search + l.hash;
  l.replace(l.origin + '/?__route=' + encodeURIComponent(route));
})();
</script>
