<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>RA10</title>
<script>
/* GitHub Pages serves this file for any path it can't find, e.g. /leaderboard or
   /btec/level-3/sport/unit-1. Those are app routes, so hand the path to the app
   shell (index.html), which restores the clean URL — and shows a proper
   "page not found" screen if the path really doesn't exist. */
(function () {
  var l = window.location;
  l.replace(l.origin + '/?__route=' + encodeURIComponent(l.pathname + l.search + l.hash));
})();
</script>
<style>
  html,body{margin:0;height:100%}
  body{display:grid;place-items:center;background:#fffdf8;font:600 15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#57534b}
  .b{display:flex;flex-direction:column;align-items:center;gap:14px}
  .b img{width:56px;height:56px;border-radius:16px;box-shadow:0 14px 30px -12px rgba(210,0,0,.6);animation:p 1.2s ease-in-out infinite}
  @keyframes p{50%{transform:scale(.92);opacity:.8}}
  @media (prefers-color-scheme:dark){body{background:#151311;color:#a8a398}}
  @media (prefers-reduced-motion:reduce){.b img{animation:none}}
</style>
</head>
<body>
  <div class="b"><img src="/logo.png" alt=""><span>Loading RA10…</span></div>
  <noscript><p style="text-align:center">This page needs JavaScript. <a href="/">Go to the RA10 home page</a>.</p></noscript>
</body>
</html>
