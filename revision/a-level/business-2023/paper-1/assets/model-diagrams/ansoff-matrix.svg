<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#f7fafc"/>
  <text x="450" y="54" text-anchor="middle" font-size="32" font-family="Arial" fill="#1e2633">Ansoff Matrix</text>
  <text x="450" y="92" text-anchor="middle" font-size="16" font-family="Arial" fill="#4d6074">Existing vs new products and markets</text>
  <line x1="180" y1="120" x2="180" y2="440" stroke="#1e2633" stroke-width="3"/>
  <line x1="180" y1="440" x2="760" y2="440" stroke="#1e2633" stroke-width="3"/>
  <text x="470" y="485" text-anchor="middle" font-size="18" font-family="Arial" fill="#1e2633">Products: Existing → New</text>
  <text x="70" y="290" transform="rotate(-90 70 290)" text-anchor="middle" font-size="18" font-family="Arial" fill="#1e2633">Markets: Existing → New</text>
  <rect x="180" y="120" width="290" height="160" rx="16" fill="#d9f2e6" stroke="#2e8b57"/>
  <text x="325" y="180" text-anchor="middle" font-size="24" font-family="Arial" fill="#1e2633">Market</text>
  <text x="325" y="212" text-anchor="middle" font-size="24" font-family="Arial" fill="#1e2633">Penetration</text>
  <text x="325" y="246" text-anchor="middle" font-size="15" font-family="Arial" fill="#4d6074">Lowest relative risk</text>
  <rect x="470" y="120" width="290" height="160" rx="16" fill="#dbeafe" stroke="#05668d"/>
  <text x="615" y="180" text-anchor="middle" font-size="24" font-family="Arial" fill="#1e2633">Product</text>
  <text x="615" y="212" text-anchor="middle" font-size="24" font-family="Arial" fill="#1e2633">Development</text>
  <text x="615" y="246" text-anchor="middle" font-size="15" font-family="Arial" fill="#4d6074">New product, same market</text>
  <rect x="180" y="280" width="290" height="160" rx="16" fill="#fff2cc" stroke="#f4a259"/>
  <text x="325" y="340" text-anchor="middle" font-size="24" font-family="Arial" fill="#1e2633">Market</text>
  <text x="325" y="372" text-anchor="middle" font-size="24" font-family="Arial" fill="#1e2633">Development</text>
  <text x="325" y="406" text-anchor="middle" font-size="15" font-family="Arial" fill="#4d6074">Same product, new market</text>
  <rect x="470" y="280" width="290" height="160" rx="16" fill="#fde2e4" stroke="#c53b3b"/>
  <text x="615" y="340" text-anchor="middle" font-size="24" font-family="Arial" fill="#1e2633">Diversification</text>
  <text x="615" y="374" text-anchor="middle" font-size="15" font-family="Arial" fill="#4d6074">Highest relative risk</text>
</svg>