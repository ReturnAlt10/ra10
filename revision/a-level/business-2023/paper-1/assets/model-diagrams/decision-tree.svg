<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#f7fafc"/>
  <text x="450" y="54" text-anchor="middle" font-size="32" font-family="Arial" fill="#1e2633">Decision Tree</text>
  <text x="450" y="92" text-anchor="middle" font-size="16" font-family="Arial" fill="#4d6074">Compare options, probabilities, outcomes, and expected values</text>
  <rect x="110" y="220" width="24" height="24" fill="#05668d"/>
  <line x1="134" y1="232" x2="310" y2="160" stroke="#1e2633" stroke-width="3"/>
  <line x1="134" y1="232" x2="310" y2="304" stroke="#1e2633" stroke-width="3"/>
  <text x="70" y="208" font-size="18" font-family="Arial" fill="#1e2633">Decision</text>
  <circle cx="340" cy="160" r="18" fill="#f4a259"/>
  <circle cx="340" cy="304" r="18" fill="#f4a259"/>
  <text x="375" y="150" font-size="18" font-family="Arial" fill="#1e2633">Option A</text>
  <text x="375" y="294" font-size="18" font-family="Arial" fill="#1e2633">Option B</text>
  <line x1="358" y1="160" x2="560" y2="110" stroke="#1e2633" stroke-width="3"/>
  <line x1="358" y1="160" x2="560" y2="210" stroke="#1e2633" stroke-width="3"/>
  <line x1="358" y1="304" x2="560" y2="254" stroke="#1e2633" stroke-width="3"/>
  <line x1="358" y1="304" x2="560" y2="394" stroke="#1e2633" stroke-width="3"/>
  <text x="460" y="120" font-size="15" font-family="Arial" fill="#4d6074">p = 0.6</text>
  <text x="460" y="205" font-size="15" font-family="Arial" fill="#4d6074">p = 0.4</text>
  <text x="460" y="270" font-size="15" font-family="Arial" fill="#4d6074">p = 0.7</text>
  <text x="460" y="390" font-size="15" font-family="Arial" fill="#4d6074">p = 0.3</text>
  <rect x="560" y="82" width="170" height="44" rx="10" fill="#d9f2e6" stroke="#2e8b57"/><text x="645" y="110" text-anchor="middle" font-size="18" font-family="Arial" fill="#1e2633">High payoff</text>
  <rect x="560" y="188" width="170" height="44" rx="10" fill="#fde2e4" stroke="#c53b3b"/><text x="645" y="216" text-anchor="middle" font-size="18" font-family="Arial" fill="#1e2633">Low payoff</text>
  <rect x="560" y="232" width="170" height="44" rx="10" fill="#d9f2e6" stroke="#2e8b57"/><text x="645" y="260" text-anchor="middle" font-size="18" font-family="Arial" fill="#1e2633">Steady payoff</text>
  <rect x="560" y="372" width="170" height="44" rx="10" fill="#fde2e4" stroke="#c53b3b"/><text x="645" y="400" text-anchor="middle" font-size="18" font-family="Arial" fill="#1e2633">Loss risk</text>
  <text x="715" y="470" text-anchor="end" font-size="18" font-family="Arial" fill="#1e2633">Use EV, then evaluate risk</text>
</svg>