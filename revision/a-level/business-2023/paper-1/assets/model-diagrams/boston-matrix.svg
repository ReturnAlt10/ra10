<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#f7fafc"/>
  <text x="450" y="54" text-anchor="middle" font-size="32" font-family="Arial" fill="#1e2633">Boston Matrix</text>
  <text x="450" y="92" text-anchor="middle" font-size="16" font-family="Arial" fill="#4d6074">Portfolio analysis using market growth and relative share</text>
  <line x1="180" y1="120" x2="180" y2="440" stroke="#1e2633" stroke-width="3"/>
  <line x1="180" y1="440" x2="760" y2="440" stroke="#1e2633" stroke-width="3"/>
  <line x1="470" y1="120" x2="470" y2="440" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="180" y1="280" x2="760" y2="280" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="470" y="485" text-anchor="middle" font-size="18" font-family="Arial" fill="#1e2633">Relative market share: High → Low</text>
  <text x="70" y="290" transform="rotate(-90 70 290)" text-anchor="middle" font-size="18" font-family="Arial" fill="#1e2633">Market growth: Low → High</text>
  <text x="325" y="200" text-anchor="middle" font-size="30" font-family="Arial" fill="#05668d">Stars</text>
  <text x="615" y="200" text-anchor="middle" font-size="30" font-family="Arial" fill="#f4a259">Question</text>
  <text x="615" y="234" text-anchor="middle" font-size="30" font-family="Arial" fill="#f4a259">Marks</text>
  <text x="325" y="360" text-anchor="middle" font-size="30" font-family="Arial" fill="#2e8b57">Cash Cows</text>
  <text x="615" y="360" text-anchor="middle" font-size="30" font-family="Arial" fill="#c53b3b">Dogs</text>
</svg>